services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    command: uvicorn mlops_esg.api.app:app --host 0.0.0.0 --port 8000
    environment:
      MLOPS_ESG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 default
    environment:
      MLOPS_ESG_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /models
    volumes:
      - hf-cache:/models
    depends_on:
      redis:
        condition: service_healthy

volumes:
  hf-cache:
